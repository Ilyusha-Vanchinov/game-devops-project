name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/game-frontend:latest

      - name: Build and push Game Server
        uses: docker/build-push-action@v5
        with:
          context: ./game-server
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/game-server:latest

      - name: Build and push Proxy
        uses: docker/build-push-action@v5
        with:
          context: ./proxy
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/game-proxy:latest

  # В реальном проекте здесь был бы шаг деплоя (SSH на сервер и docker stack deploy)