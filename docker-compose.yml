version: '3.8'

services:
  proxy:
    build: ./proxy
    ports:
      - "80:80"
    depends_on:
      - frontend
      - game-server

  frontend:
    build: ./frontend

  game-server:
    build: ./game-server
    environment:
      - DATABASE_URL=postgres://user:password@postgres:5432/gamedb
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gamedb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./game-server/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine

volumes:
  pgdata: